# ============================================================================
#  Configuracion por defecto de CrediYa
#
#  Este archivo se versiona y NO debe contener claves reales. Para trabajar en
#  su maquina, cree "crediya.local.properties" en la raiz del proyecto (esta
#  ignorado por git) o exporte variables de entorno.
#
#  Precedencia, de mayor a menor:
#    1. Variables de entorno  (CREDIYA_DB_CLAVE, ...)
#    2. crediya.local.properties
#    3. Este archivo
# ============================================================================

# Almacen activo: mysql | archivo | memoria
crediya.persistencia=mysql

# Carpeta donde viven los .txt del almacen de archivos y las exportaciones
crediya.datos.carpeta=datos

# Conexion JDBC
crediya.db.url=jdbc:mysql://localhost:3306/crediya_db?serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true
crediya.db.usuario=crediya_app
crediya.db.clave=
